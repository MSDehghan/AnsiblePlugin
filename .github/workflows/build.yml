name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: jetbrains

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install Ansible for the bundled module documentation
      run: python -m pip install ansible==15.0.0

    - name: Build with Gradle
      run: ./gradlew generatePluginDocs build buildPlugin --info

    - name: Verify Plugin on IntelliJ Platforms
      run: ./gradlew verifyPlugin --info
